<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grove · Agent Monitor</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="bar" role="toolbar" aria-label="Grove controls">
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="view-scene" aria-pressed="true">Scene</button>
      <button type="button" id="view-gallery" aria-pressed="false">Sprites</button>
    </div>
    <label class="field">Time
      <select id="theme">
        <option value="night">Night</option>
        <option value="dusk">Dusk</option>
        <option value="dawn">Dawn</option>
      </select>
    </label>
    <div class="seg" role="group" aria-label="Preview">
      <button type="button" id="demo" title="Hire a demo party that moves between stations">Summon demo</button>
      <button type="button" id="clear">Clear</button>
    </div>
    <button type="button" id="pause" aria-pressed="false">Pause</button>
    <button type="button" id="inbox-btn" class="inbox-btn" aria-haspopup="dialog" aria-controls="inbox" hidden>Inbox <span id="inbox-count" class="count"></span><span id="inbox-attached" class="attached-hint"></span></button>
  </header>
  <main id="stage">
    <canvas id="screen" width="240" height="160" role="img" aria-label="A moonlit forest grove"></canvas>
  </main>
  <nav id="task-strip" class="strip" aria-label="Tasks" hidden></nav>
  <section id="forum" class="forum-screen" aria-label="Forum" hidden></section>
  <section id="inbox" class="inbox" role="dialog" aria-modal="true" aria-labelledby="inbox-title" hidden></section>
  <p id="status" role="status" aria-live="polite">Waking the grove…</p>
  <script type="module" src="static/app.mjs"></script>
</body>
</html>
